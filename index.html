<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BBL Mieterportal</title>
<!-- No tab icon. `data:,` is an empty inline resource: it suppresses the
     favicon without leaving the browser to request /favicon.ico and log a
     404. The tab identifies the page by its title, which markRouteRendered
     keeps per-route. -->
<link rel="icon" href="data:,">
<!-- Font + module preloads (review P9/P10): the fonts otherwise sit at hop 4
     of the CSS @import chain (HTML → main.css → tokens.css → font fetch) and
     FOUT on every cold visit; the ES-module graph is likewise discovered
     only after app.js parses. Preloading flattens both waterfalls without
     touching the documented main.css cascade order. -->
<link rel="preload" href="assets/fonts/NotoSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/NotoSans-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="modulepreload" href="js/lib.js">
<link rel="modulepreload" href="js/state.js">
<link rel="modulepreload" href="js/shell.js">
<link rel="modulepreload" href="js/wizard.js">
<link rel="modulepreload" href="js/catalogue-bar.js">
<link rel="modulepreload" href="js/spatial-tree.js">
<link rel="modulepreload" href="js/search-engine.js">
<link rel="stylesheet" href="css/main.css">
</head>
<!-- `body--intranet` selects the CD Bund intranet skin (blue brand + blue
     chrome ramp) over the public-facing federal-red default. Same class name
     and placement as the design system's own AlterBodyClasses; the token
     overrides live in css/foundations/tokens.css. Remove it to return the
     portal to the public skin. -->
<body class="body--intranet">

<div id="root"></div>

<noscript>
  <div class="noscript-fallback">
    <h1>BBL Mieterportal</h1>
    <p>Diese Anwendung benötigt JavaScript. Bitte aktivieren Sie JavaScript in Ihrem Browser, oder kontaktieren Sie den
       <a href="https://www.bbl.admin.ch/de/kontakt">BBL Mieterportal-Support</a>.</p>
    <p>Stand: 2026 · Bundesamt für Bauten und Logistik (BBL)</p>
  </div>
</noscript>

<script type="module" src="js/app.js"></script>

</body>
</html>
